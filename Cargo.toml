[workspace]
resolver = "2"
members = [
    "crates/otto-core",
    "crates/otto-skills/github",
    "crates/otto-skills/deploy",
    "crates/otto-skills/calendar",
    "crates/otto-skills/notify",
    "crates/otto-voice",
    "crates/otto-ui",
    "crates/otto-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bean-code/otto"

[workspace.dependencies]
otto-core = { path = "crates/otto-core" }
otto-skill-github = { path = "crates/otto-skills/github" }
otto-skill-deploy = { path = "crates/otto-skills/deploy" }
otto-skill-calendar = { path = "crates/otto-skills/calendar" }
otto-skill-notify = { path = "crates/otto-skills/notify" }
otto-voice = { path = "crates/otto-voice" }

llmprism = { version = "0.4", features = ["anthropic"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
keyring = "3"
directories = "5"
dotenvy = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
