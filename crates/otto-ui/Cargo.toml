[package]
name = "otto-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[lib]
name = "otto_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "otto-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
otto-core = { workspace = true }
otto-skill-github = { workspace = true }
otto-skill-deploy = { workspace = true }
otto-skill-calendar = { workspace = true }
otto-skill-notify = { workspace = true }
otto-voice = { workspace = true }
llmprism = { workspace = true }
tauri = { version = "2", features = ["image-png"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
notify-rust = "4"
# For opening github.com/login/device in the user's default browser during
# the Device Flow sign-in - not a Tauri-specific opener since otto-cli (no
# Tauri) uses the same crate for the identical flow.
webbrowser = "1.2"
dotenvy.workspace = true
